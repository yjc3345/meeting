<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>meeting</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;color:#263449;background:#f6f7f9}button,input{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}aside{width:245px;background:#fff;border-right:1px solid #e5e8ed;padding:24px 15px;flex-shrink:0}h1{font-size:23px;margin:0 0 22px}button{border:1px solid #dce2e9;background:white;border-radius:7px;padding:9px 12px}button:hover{background:#edf2f8}.new{width:100%;background:#263e60;color:#fff;font-weight:bold}.docitem{display:block;width:100%;text-align:left;margin-top:8px;border:0}.selected{background:#eaf0f7}main{width:min(920px,100%);margin:0 auto;padding:28px 35px}.bar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:22px}.sheet{background:#fff;border:1px solid #e7ebf0;box-shadow:0 8px 28px #1d355012;border-radius:12px;min-height:700px;padding:54px 65px}.title{width:100%;border:0;font-size:32px;font-weight:800;outline:0;margin:0 0 25px}.tools{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px;border-bottom:1px solid #e5eaf0;padding-bottom:13px}.tools button{font-size:12px;padding:7px 10px}.editor{min-height:430px;outline:0;line-height:1.8;font-size:15px;overflow-wrap:anywhere}.editor table{border-collapse:collapse;width:100%;margin:15px 0}.editor td,.editor th{border:1px solid #cbd5e1;padding:8px;min-width:36px}.editor table{table-layout:fixed}.editor td,.editor th{overflow-wrap:anywhere}.editor blockquote{border-left:3px solid #8aa0bd;padding-left:14px;color:#59697d}.private{background:#f1edf8;border-left:4px solid #8c77a8;padding:10px;margin:12px 0}.hint{font-size:12px;color:#8b97a6;margin-top:20px}.print-title{display:none}@media(max-width:700px){.layout{display:block}aside{width:100%;padding:14px}main{padding:15px}.sheet{padding:25px 18px}.title{font-size:25px}}@page{size:A4;marg /* meeting visual refresh */
:root{--ink:#202b3a;--muted:#84909d;--line:#e9edf1;--accent:#304a64}
body{background:#f7f8fa;color:var(--ink);font-family: "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.02em}
aside{width:256px;background:#fbfcfd;border-right:1px solid #e8ebef;padding:34px 18px}
aside h1{font-size:27px;font-weight:800;letter-spacing:-1.3px;margin:0 10px 31px}
button{transition:background .15s,border-color .15s,box-shadow .15s;border-radius:9px}

.bar button:nth-last-child(2){background:#eff4f8;color:#3b5c79;border-color:#dce7ef}

.sheet{border:1px solid #e9edf1;box-shadow:0 16px 48px #29394a0b,0 2px 8px #29394a06;border-radius:15px;padding:63px 73px 55px;min-height:800px}

.editor tr:hover td{background:#fafcfd}

.private{background:#f7f5fa;border:1px solid #eae4f1;border-left:3px solid #9b87ae;color:#574a67}
.memo{background:#f3f8fb;border:1px solid #e1ebf2;border-left:3px solid #82a7bf;color:#395b70}
.private p,.memo p{margin:6px 0}
.sheet>.hint{font-size:11px;color:#9aa5b0;margin-top:24px}

.savebar button{padding:12px 17px;font-size:12px;border-radius:9px}

.savebar button:nth-child(2){background:#304a64;color:#fff;border:1px solid #304a64}
#versionStatus{width:100%;font-size:11px;color:#96a1ac;margin-top:4px}

#tableMenu button{padding:11px 13px;color:#42546a;border-radius:6px}

@media(max-width:600px){.layout{display:block}aside{width:100%;padding:17px 15px}aside h1{margin:0 0 14px}.new{max-width:220px}#list{display:flex;gap:5px;overflow-x:auto;margin-top:12px}.docitem{min-width:120px}aside .hint{display:none}main{padding:14px 12px 50px}.bar{justify-content:flex-start}.sheet{padding:28px 20px}.tools{gap:3px}.tools button{padding:7px}.title{font-size:26px}.editor{font-size:14px}}

/* A4 WYSIWYG page: 210mm paper, 17mm margins = 176mm content */
:root{--paper-width:210mm;--paper-margin:17mm;--content-width:176mm}

.sheet{width:210mm;max-width:100%;margin:0 auto;padding:17mm;min-height:297mm;border-radius:3px}

}.editor .memo,.editor .private{min-height:30px!important;padding-top:5px;padding-bottom:5px}.editor .memo p,.editor .private p{margin:2px 0}#printBody .memo,#printBody .private{min-height:0!important;padding-top:5px;padding-bottom:5px}#printBody .memo p,#printBody .private p{margin:2px 0}</style></head><body><div class="layout"><aside><h1>meeting<span style="color:#8ca0b7">.</span></h1><button class="new" onclick="addDoc()">＋ 새 회의록</button><div id="list"></div><p class="hint">이 버전은 현재 브라우저에 자동 저장됩니다. 다른 기기와는 동기화되지 않습니다.</p></aside><main><div class="bar"><button onclick="duplicate()">복제</button><button onclick="removeDoc()">삭제</button><button onclick="printAs('teacher')">선생님용 인쇄</button><button onclick="printAs('admin')" style="background:#263e60;color:white">관리자용 인쇄</button></div><section class="sheet"><input id="title" class="title" placeholder="회의 제목" oninput="save()"><div class="tools"><button onclick="cmd('bold')"><b>굵게</b></button><button onclick="cmd('italic')"><i>기울임</i></button><button onclick="block('h2')">제목</button><button onclick="block('p')">본문</button><button onclick="cmd('insertUnorderedList')">• 목록</button><button onclick="cmd('insertOrderedList')">1. 목록</button><button onclick="addTable()">표 삽입</button><button onclick="addColumn()">＋ 오른쪽 열</button><button onclick="addRow()">＋ 아래쪽 행</button><button onclick="deleteColumn()">열 삭제</button><button onclick="deleteRow()">행 삭제</button><button onclick="mergeRight()">오른쪽 셀 병합</button><button onclick="splitCell()">셀 분할</button><button onclick="addMemo()">📝 메모 블록</button><button onclick="addPrivate()">🔒 관리자 전용 블록</button><button onclick="cmd('insertHorizontalRule')">구분선</button><button onclick="cmd('undo')">↶ 실행 취소</button></div><div id="editor" class="editor" contenteditable="true" oninput="save()" aria-label="회의 내용 편집"></div><p class="hint">본문을 클릭해 자유롭게 작성하세요. 관리자 전용 블록은 선생님용 인쇄에서 제외됩니다.</p><div class="savebar"><button onclick="saveVersion('teacher')">선생님들용 저장</button><button onclick="saveVersion('admin')">관리자용 저장</button><span id="versionStatus"></span></div></section></main></div><div id="printPage"><h1 id="printHeading"></h1><div id="printBody"></div></div><div id="tableMenu"><button onclick="act(addRow)">＋ 아래 행</button><button onclick="act(addColumn)">＋ 오른쪽 열</button><button onclick="act(deleteRow)">행 삭제</button><button onclick="act(deleteColumn)">열 삭제</button><button onclick="act(mergeRight)">오른쪽 병합</button><button onclick="act(splitCell)">셀 분할</button></div><script>const KEY='meeting-editor-v1';let docs=[],id=null;const $=x=>document.getElementById(x);function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function persist(){try{localStorage.setItem(KEY,JSON.stringify(docs))}catch(e){alert('저장 공간이 부족합니다')}}function addDoc(){let d={id:uid(),title:'새 회의록',html:'<h2>1. 초등영어 배치고사</h2><p>여기에 회의 내용을 입력하세요.</p>'};docs.unshift(d);persist();openDoc(d.id)}function openDoc(x){id=x;let d=docs.find(v=>v.id===id);if(!d)return;$('title').value=d.title;$('editor').innerHTML=d.html;render();showVersionStatus();setTimeout(handles,0);setTimeout(watchBlocks,0)}function save(){let d=docs.find(v=>v.id===id);if(!d)return;d.title=$('title').value;d.html=$('editor').innerHTML;persist();render()}function render(){$('list').innerHTML='';docs.forEach(d=>{let b=document.createElement('button');b.className='docitem'+(id===d.id?' selected':'');b.textContent=d.title||'제목 없음';b.onclick=()=>openDoc(d.id);$('list').appendChild(b)})}function cmd(x,value){$('editor').focus();document.execCommand(x,false,value||null);save()}function block(tag){cmd('formatBlock',tag)}function insert(html){$('editor').focus();document.execCommand('insertHTML',false,html);save()}function addTable(){insert('<table contenteditable="true"><tbody><tr><th>항목</th><th>내용</th></tr><tr><td>반</td><td>교재</td></tr><tr><td><br></td><td><br></td></tr></tbody></table><p><br></p>')}function selectedCell(){const sel=window.getSelection();if(!sel||!sel.rangeCount)return null;let n=sel.anchorNode;if(n&&n.nodeType===3)n=n.parentElement;const cell=n?.closest?.('td,th');return cell&&$('editor').contains(cell)?cell:null}let lastCell=null;$('editor').addEventListener('click',e=>{const c=e.target.closest('td,th');if(c)lastCell=c});$('editor').addEventListener('keyup',()=>{const c=selectedCell();if(c)lastCell=c});function tableCell(){const c=selectedCell()||lastCell;return c&&$('editor').contains(c)?c:null}function addColumn(){const cell=tableCell();if(!cell){alert('먼저 표 안의 셀을 클릭해 주세요.');return}const table=cell.closest('table');const index=cell.cellIndex;Array.from(table.rows).forEach(row=>{const ref=row.cells[index];const next=document.createElement(ref?.tagName.toLowerCase()==='th'?'th':'td');next.innerHTML='<br>';if(ref)ref.after(next);else row.appendChild(next)});save()}function addRow(){const cell=tableCell();if(!cell){alert('먼저 표 안의 셀을 클릭해 주세요.');return}const row=cell.parentElement;const newRow=row.cloneNode(false);Array.from(row.cells).forEach(c=>{const next=document.createElement(c.tagName.toLowerCase());next.innerHTML='<br>';newRow.appendChild(next)});row.after(newRow);save()}function deleteRow(){const c=tableCell();if(!c){alert('표 안의 셀을 선택해 주세요.');return}const t=c.closest('table');if(t.rows.length<=1){alert('마지막 행은 삭제할 수 없습니다.');return}c.parentElement.remove();lastCell=null;save()}function deleteColumn(){const c=tableCell();if(!c){alert('표 안의 셀을 선택해 주세요.');return}const t=c.closest('table'),index=c.cellIndex;if([...t.rows].some(r=>r.cells.length<=1)){alert('마지막 열은 삭제할 수 없습니다.');return}Array.from(t.rows).forEach(r=>r.cells[index]?.remove());lastCell=null;save()}function mergeRight(){const c=tableCell();if(!c){alert('표 안의 셀을 선택해 주세요.');return}const next=c.nextElementSibling;if(!next||!next.matches('td,th')){alert('오른쪽에 병합할 셀이 없습니다.');return}const count=Number(c.getAttribute('colspan')||1)+Number(next.getAttribute('colspan')||1);if(next.textContent.trim())c.innerHTML+=(c.textContent.trim()?'<br>':'')+next.innerHTML;c.colSpan=count;next.remove();lastCell=c;save()}function splitCell(){const c=tableCell();if(!c){alert('표 안의 셀을 선택해 주세요.');return}const count=Number(c.colSpan||1);if(count<=1){alert('병합된 셀을 선택해 주세요.');return}c.colSpan=count-1;const n=document.createElement(c.tagName.toLowerCase());n.innerHTML='<br>';c.after(n);lastCell=c;save()}function act(fn){menu.style.display='none';fn();setTimeout(handles,0)}const menu=document.getElementById('tableMenu');$('editor').addEventListener('contextmenu',e=>{const c=e.target.closest('td,th');if(!c)return;e.preventDefault();lastCell=c;menu.style.display='block';menu.style.left=Math.min(e.clientX,innerWidth-180)+'px';menu.style.top=Math.min(e.clientY,innerHeight-270)+'px'});document.addEventListener('click',e=>{if(!menu.contains(e.target))menu.style.display='none'});let grips=[];function handles(){grips.forEach(x=>x.remove());grips=[];$('editor').querySelectorAll('table').forEach(t=>{const row=t.rows[0];if(!row||row.cells.length<2)return;Array.from(row.cells).slice(0,-1).forEach((c,i)=>{const rect=c.getBoundingClientRect(),tr=t.getBoundingClientRect(),h=document.createElement('div');h.className='resize-handle';h.style.left=(rect.right-4)+'px';h.style.top=tr.top+'px';h.style.height=tr.height+'px';document.body.appendChild(h);grips.push(h);h.addEventListener('pointerdown',e=>{e.preventDefault();h.setPointerCapture(e.pointerId);const start=e.clientX, widths=Array.from(row.cells).map(x=>x.getBoundingClientRect().width);const move=ev=>{const delta=Math.max(40-widths[i],Math.min(widths[i+1]-40,ev.clientX-start));const w=[...widths];w[i]+=delta;w[i+1]-=delta;let g=t.querySelector('colgroup');if(!g){g=document.createElement('colgroup');t.prepend(g)}g.replaceChildren(...w.map(v=>{const col=document.createElement('col');col.style.width=(v/w.reduce((a,b)=>a+b,0)*100)+'%';return col}));h.style.left=(rect.right+delta-4)+'px'};h.addEventListener('pointermove',move);h.addEventListener('pointerup',()=>{h.removeEventListener('pointermove',move);save();handles()},{once:true})})})})}window.addEventListener('resize',handles);window.addEventListener('scroll',handles,true);$('editor').addEventListener('click',()=>setTimeout(handles,0));window.addEventListener('beforeprint',()=>grips.forEach(x=>x.remove()));window.addEventListener('afterprint',handles);const blockObserver=new ResizeObserver(entries=>{for(const entry of entries){const el=entry.target;if(el.isConnected&&$('editor').contains(el)){const w=el.getBoundingClientRect().width,h=el.getBoundingClientRect().height;if(Math.abs(w-(parseFloat(el.dataset.lastW)||w))>2||Math.abs(h-(parseFloat(el.dataset.lastH)||h))>2){el.dataset.lastW=w;el.dataset.lastH=h;clearTimeout(el._resizeSave);el._resizeSave=setTimeout(()=>{el.style.height=Math.round(el.getBoundingClientRect().height)+'px';el.style.width=Math.round(el.getBoundingClientRect().width)+'px';save()},250)}}}});function watchBlocks(){$('editor').querySelectorAll('.memo,.private').forEach(el=>{if(el.dataset.watching)return;el.dataset.watching='1';blockObserver.observe(el)})}new MutationObserver(()=>watchBlocks()).observe($('editor'),{childList:true,subtree:true});function addMemo(){insert('<div class="memo"><b>메모</b><p>여기에 메모를 작성하세요.</p></div><p><br></p>')}function addPrivate(){insert('<div class="private" contenteditable="true"><b>관리자 메모</b><p>여기에 회의 중 메모를 작성하세요.</p></div><p><br></p>')}function duplicate(){let d=docs.find(v=>v.id===id);let n={...d,id:uid(),title:d.title+' (복사본)'};docs.unshift(n);persist();openDoc(n.id)}function removeDoc(){if(!confirm('이 회의록을 삭제할까요?'))return;docs=docs.filter(v=>v.id!==id);persist();if(docs.length)openDoc(docs[0].id);else addDoc()}function saveVersion(type){save();const d=docs.find(v=>v.id===id);if(!d)return;d[type+'Version']={title:d.title,html:d.html,savedAt:new Date().toISOString()};persist();showVersionStatus();alert((type==='teacher'?'선생님들용':'관리자용')+' 회의록이 별도로 저장되었습니다.')}function showVersionStatus(){const d=docs.find(v=>v.id===id);const el=$('versionStatus');if(!el||!d)return;el.textContent='선생님용 '+(d.teacherVersion?'저장됨':'미저장')+' · 관리자용 '+(d.adminVersion?'저장됨':'미저장')}function printAs(type){const d=docs.find(v=>v.id===id);const version=d?.[type+'Version'];if(!version){alert((type==='teacher'?'선생님들용':'관리자용')+' 저장을 먼저 눌러주세요.');return}document.body.classList.remove('teacher-print','admin-print');document.body.classList.add(type+'-print');$('printHeading').textContent=version.title;$('printBody').innerHTML=version.html;if(type==='teacher')$('printBody').querySelectorAll('.private').forEach(x=>x.remove());window.print()}try{docs=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(docs))docs=[]}catch(e){docs=[]}if(!docs.length)addDoc();else openDoc(docs[0].id);</script></body></html>
